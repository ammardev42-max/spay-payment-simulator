spring:
  application:
    name: SPay

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spay_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Root@123}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8080}

spay:
  jwt:
    secret-key: ${JWT_SECRET_KEY:spay-local-dev-secret-key-change-before-production-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}